name: Publish Docker image

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jayvenco/dockerappblueprint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out image tags
        id: tags
        run: |
          # develop -> :staging, main -> :latest, v* tag -> :vX.Y.Z (+ :latest)
          TAGS="${IMAGE}:${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/main)    TAGS="${TAGS},${IMAGE}:latest" ;;
            refs/heads/develop) TAGS="${TAGS},${IMAGE}:staging" ;;
            refs/tags/v*)       TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" ;;
            *)                  TAGS="${TAGS},${IMAGE}:staging" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A plain image manifest (no attestation index): that is what Unraid compares to detect updates.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
